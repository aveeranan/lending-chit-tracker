{% extends "base.html" %}

{% block title %}Monthly Report - Lending Tracker{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Monthly Report</h1>
</div>

<div class="filters">
    <div class="filter-group" style="align-items: center; display: flex; gap: 12px;">
        <button onclick="changeMonth(-1)" style="padding: 6px 14px; font-size: 18px; cursor: pointer; border: 1px solid #ccc; border-radius: 6px; background: #f5f5f5;">&#8592;</button>
        <span id="monthDisplay" style="font-size: 1.1rem; font-weight: 600; min-width: 110px; text-align: center;"></span>
        <button onclick="changeMonth(1)" style="padding: 6px 14px; font-size: 18px; cursor: pointer; border: 1px solid #ccc; border-radius: 6px; background: #f5f5f5;">&#8594;</button>
        <input type="hidden" id="reportMonth">
    </div>
    <div class="filter-group">
        <label>
            <input type="checkbox" id="includeClosed" onchange="loadMonthlyReport()">
            Include Closed Loans
        </label>
    </div>
</div>

<div id="reportContent">
    <p class="info-message">Select a month to view the report.</p>
</div>

<script src="{{ url_for('static', filename='js/monthly_report.js') }}"></script>
{% endblock %}
